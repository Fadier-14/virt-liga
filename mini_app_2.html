<!DOCTYPE html>
<html lang="ru">
<head>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вирт Лига</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #070b12;
      color: #f3f6fb;
      font-family: Arial, sans-serif;
    }
    
    .logo h1 {
      font-size: 45px;
    }
    h2 {
      font-size: 10px;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .banner h1 {
      margin: 0px;
      font-family: "Oswald", Arial, sans-serif;
      font-weight: 700;
      letter-spacing: 3px;
    }
    .banner {
      background: #102033;
      background-image: url("stadion_3.jpg");
      background-size: cover;
      background-position: center;
      text-align: center;
      border-bottom: 1px solid #252b33;
      margin-top: 50px;
    }
    .banner {
      background:
      linear-gradient(rgba(7, 11, 18, 0.55), rgba(7, 11, 18, 0.75)),
      url("stadion_3.jpg") center / cover;
      padding: 16px 16px 10px;
}
    .profile {
      padding: 10px 14px;
      margin: 10px 10px;
      border: 1px solid #252b33;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 12px
    }
    .profile-right {
      margin-left: auto;
      padding-left: 12px;
      border-left: 1px solid #2a3344;
      color: #9aa6b8;
      font-size: 13px;
      max-width: 90px;
      text-align: right;
    } 

    .profile-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
  
    }
    .who {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    #ava {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
    #id {
      font-size: 16px;
      font-weight: 700;
    }
    #balance {
      display: flex;
      align-items: baseline;
      gap: 4px;
      white-space: nowrap;
    }
    #coins {
      color: #e8c15a;
      font-weight: 700;
      font-size: 14px;
    } 
    .balance-label {
      font-size: 5px;
      color: #8b97a8;
      white-space: nowrap;
    }
    .center-banner {
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: url("stadion_3.jpg");
      background: #102033;
      background-size: cover;
      background-position: center;
      text-align: center;
      border: 1px solid #252b33;
      border-radius: 12px;
      padding: 90px 14px;
      margin: 10px 10px;
      gap: 10px;
      background:
      linear-gradient(rgba(7, 11, 18, 0.55), rgba(7, 11, 18, 0.75)),
      url("stadion_3.jpg") center / cover;
    }
    #cbu {
      font-weight: 700;
      font-size: 16px;
      color: white;
    }
    #cbd {
      font-size: 13px;
      color: #8b97a8;
    }
    #icon1 {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid #3d4a5c;
      background: #000;
      margin: 0 auto 12px;
    }
    .icon1 img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      
    }
    .find-btn {
      display: block;
      width: calc(100% - 20px);
      background: linear-gradient(#2fbf73, #14945f);
      
      text-align: center;
      margin: 12px 10px 0;
      border-radius: 999px;
      box-sizing: border-box;
      padding: 16px 14px;
    }
    
    .loupe {
  width: 16px;
  height: 16px;
  border: 2px solid #fff;
  border-radius: 50%;
  position: relative;
  flex-shrink: 0;
}
.loupe::after {
  content: "";
  position: absolute;
  width: 7px;
  height: 2px;
  background: #fff;
  right: -5px;
  bottom: -1px;
  transform: rotate(45deg);
}
.chev {
  color: #fff;
  font-size: 22px;
  line-height: 1;
}
#fbtn1 {
      color: white;
      font-weight: 500;
      font-size: 16px;
    }
    .wait-screen {
  display: none;
  position: fixed;
  inset: 0;
  flex-direction: column;
  align-items: center;
  background: rgba(0, 0, 0, 0.72);
  z-index: 20;
}
.wait-screen p {
  margin: auto;
}
#cancel-btn {
  width: calc(100% - 20px);
  margin-bottom: 24px;
  padding: 10px;
}
  </style>
</head>
<body>
  
  <header class="banner">
  <div class="logo">
    <svg width="40" height="36" viewBox="0 0 64 48" aria-hidden="true">
      <path fill="#ffffff" d="M4 44 V16 L18 28 L28 8 L32 44 Z"/>
      <path fill="#22c55e" d="M32 44 V8 L44 28 L60 16 V44 Z"/>
    </svg>
    <h1>ВИРТ ЛИГА</h1>
  </div>
    <h2>футбольные лиги в телеграмм</h2>
  </header>
  <div class="profile">
    <div class="profile-left">
      <img id="ava" alt="" width="48" height="48">
      <div class="who">
        <span id="nick">Ваня</span>
        <span id="balance">
          <span id="coins"></span>
          <span class="balance-label">Профильный баланс</span>
        </span>
      </div>
    
      
    </div>
    <div class="profile-right">
      Нет активной сессии
    </div>
  </div>
  <div class="center-banner">
    <img id="icon1" alt="" src="icon-find2.png">
    <span id="cbu">Нет активной сессии</span>
    <span id="cbd">Нажмите "найти сессию"<br>чтобы присоединиться к лиге<br>и сыграть с другими игроками.</span>
  </div>
    <button type="button" id="find-btn" class="find-btn">
    
      <span class="loupe"></span>
      <span id="fbtn1">НАЙТИ СЕССИЮ</span>
      <span class="chev">›</span>
    </button>
  <div id="wait" class="wait-screen">
  <p>Ищем сессию</p>
  <button type="button" id="cancel-btn">Отменить</button>
</div>
  <script>
    document.getElementById("nick").textContent = "скрипт жив";
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();

  const API = "https://unroll-drivable-majorette.ngrok-free.dev"
  async function sendPass() {
    if (!tg || !tg.initData) return;
    const res = await fetch(API + "/auth", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ initData: tg.initData})
    });

    const data = await res.json();

  if (data.ok) {
    document.getElementById("coins").textContent = data.coins + "⚽"
  }

  }
  

  sendPass();
  }
  
  
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u) {
  document.getElementById("nick").textContent = u.first_name;

  if (u.photo_url) {
    document.getElementById("ava").src = u.photo_url;
  } else {
    document.getElementById("ava").replaceWith(
      Object.assign(document.createElement("div"), {
        className: "ava-letter",
        textContent: u.first_name.charAt(0)
        })
      );
    }
  }
  const API = "https://unroll-drivable-majorette.ngrok-free.dev"
  document.getElementById("find-btn").onclick = async function () {
const res2 = await fetch(API + "/queue1", {
  method: "POST",
  headers: {"Content-Type": "application/json"},
  body: JSON.stringify({ initData: tg.initData})
})

  const data2 = await res2.json();
  if (data2.ok) {
    document.getElementById("wait").style.display = "flex"
  }
  }
  document.getElementById("cancel-btn").onclick = async function (params) {
    document.getElementById("wait").style.display = "none";
    await fetch(API + "/queue0", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ initData: tg.initData })
  });
};
  
</script>
</body>
</html>
