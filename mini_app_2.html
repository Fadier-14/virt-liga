<!DOCTYPE html>
<html lang="ru">
<head>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вирт Лига</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #070b12;
      color: #f3f6fb;
      font-family: Arial, sans-serif;
    }
    
    .logo h1 {
      font-size: 45px;
    }
    h2 {
      font-size: 10px;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .banner h1 {
      margin: 0px;
      font-family: "Oswald", Arial, sans-serif;
      font-weight: 700;
      letter-spacing: 3px;
    }
    .banner {
      background: #102033;
      background-image: url("stadion_3.jpg");
      background-size: cover;
      background-position: center;
      text-align: center;
      border-bottom: 1px solid #252b33;
      margin-top: 50px;
    }
    .banner {
      background:
      linear-gradient(rgba(7, 11, 18, 0.55), rgba(7, 11, 18, 0.75)),
      url("stadion_3.jpg") center / cover;
      padding: 16px 16px 10px;
}
    .profile {
      padding: 10px 14px;
      margin: 10px 20px;
      border: 1px solid #252b33;
      border-radius: 12px;
      display: flex;
      align-items: center;
    }
    .profile-right {
      border-left: 1px solid #2a3344;
      padding-left: 12px;
    }
    

  </style>
</head>
<body>
  
  <header class="banner">
  <div class="logo">
    <svg width="40" height="36" viewBox="0 0 64 48" aria-hidden="true">
    <path fill="#ffffff" d="M4 44 V16 L18 28 L28 8 L32 44 Z"/>
    <path fill="#22c55e" d="M32 44 V8 L44 28 L60 16 V44 Z"/>
  </svg>
    <h1>ВИРТ ЛИГА</h1>
  </div>
    <h2>футбольные лиги в телеграмм</h2>
  </header>
  <div class="profile">
    <div class="profile-left">
      <img id="ava" alt="" width="48" height="48">
      <span id="nick">Ваня</span>
    </div>
    <div class="profile-right">
      Нет активной сессии
    </div>
  </div>
  <script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
  }
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u) {
  document.getElementById("nick").textContent = u.first_name;

  if (u.photo_url) {
    document.getElementById("ava").src = u.photo_url;
  } else {
    document.getElementById("ava").replaceWith(
      Object.assign(document.createElement("div"), {
        className: "ava-letter",
        textContent: u.first_name.charAt(0)
        })
      );
    }
  }

</script>
</body>
</html>
