<!DOCTYPE html>
<html lang="ru">
<head>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вирт Лига</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
  <style>

    html, body {
    width: 100vw;
    height: 100vh;
    margin: 0;
    overflow: hidden;
    background: #070b12;
    color: #f3f6fb;
    font-family: Arial, sans-serif;
  }
    
    .logo h1 {
    font-size: clamp(42px, 7vw, 58px);
    font-weight: 700;
    letter-spacing: clamp(2px, 0.3vw, 4px);
    margin: 0;
  }
    h2 {
    font-size: clamp(11px, 2.8vw, 14px);
    margin: 0;
  }
    .logo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
    .banner {
    background: #102033;
    background-image: url("stadion_3.jpg");
    background-size: cover;
    background-position: center;
    text-align: center;
    border-bottom: 1px solid #252b33;
    margin-top: clamp(30px, 7vh, 70px);
  }
    .banner {
    background:
      linear-gradient(rgba(7, 11, 18, 0.55), rgba(7, 11, 18, 0.75)),
      url("stadion_3.jpg") center / cover;
    padding: clamp(10px, 2.25vh, 20px) clamp(10px, 3.5vw, 20px) clamp(6px, 1.5vh, 14px);
  }
    .profile {
    padding: clamp(12px, 2.2vh, 20px) clamp(15px, 4.5vw, 25px);
    margin: clamp(8px, 1.7vh, 16px) clamp(12px, 3.6vw, 20px);
    border: 1px solid #252b33;
    border-radius: 14px;
    font-size: clamp(15px, 4.2vw, 18px);
  }
    .profile-right {
    margin-left: auto;
    padding-left: clamp(8px, 2.7vw, 16px);
    border-left: 1px solid #2a3344;
    color: #9aa6b8;
    font-size: clamp(13px, 3.8vw, 15px);
    text-align: right;
    white-space: nowrap;
  }

   .profile-left {
    display: flex;
    align-items: center;
    gap: clamp(8px, 2.5vh, 16px);
    min-width: 0;
  }
    .who {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
    #ava {
    width: clamp(42px, 5.5vw, 58px);
    height: clamp(42px, 5.5vw, 58px);
    object-fit: cover;
    border-radius: 50%;
    flex-shrink: 0;
  }
    #id {
  font-size: clamp(15px, 4.2vw, 18px);
  font-weight: 700;
}
    #balance {
    display: flex;
    align-items: baseline;
    gap: 4px;
    white-space: nowrap;
  }
    #coins {
    color: #e8c15a;
    font-weight: 700;
    font-size: 14px;
  }
    .balance-label {
    font-size: 5px;
    color: #8b97a8;
    white-space: nowrap;
  }
    .center-banner {
    display: flex;
    flex-direction: column;
    align-items: center;
    background-image: url("stadion_3.jpg");
    background: #102033;
    background-size: cover;
    background-position: center;
    text-align: center;
    border: 1px solid #252b33;
    border-radius: 12px;
    padding: 90px 14px;
    margin: 10px 10px;
    gap: 10px;
    background:
      linear-gradient(rgba(7, 11, 18, 0.55), rgba(7, 11, 18, 0.75)),
      url("stadion_3.jpg") center / cover;
  }
    #cbu {
      font-weight: 700;
      font-size: 16px;
      color: white;
    }
    #cbd {
      font-size: 13px;
      color: #8b97a8;
    }
    #icon1 {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px solid #3d4a5c;
      background: #000;
      margin: 0 auto 12px;
    }
    .icon1 img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      
    }
    .find-btn {
      display: block;
      width: calc(100% - 20px);
      background: linear-gradient(#2fbf73, #14945f);
      
      text-align: center;
      margin: 12px 10px 0;
      border-radius: 999px;
      box-sizing: border-box;
      padding: 16px 14px;
    }
    
    .loupe {
  width: 16px;
  height: 16px;
  border: 2px solid #fff;
  border-radius: 50%;
  position: relative;
  flex-shrink: 0;
}
.loupe::after {
  content: "";
  position: absolute;
  width: 7px;
  height: 2px;
  background: #fff;
  right: -5px;
  bottom: -1px;
  transform: rotate(45deg);
}
.chev {
  color: #fff;
  font-size: 22px;
  line-height: 1;
}
#fbtn1 {
      color: white;
      font-weight: 500;
      font-size: 16px;
    }
    .wait-screen {
  font-size: 20px;
  font-weight: 600;
  display: none;
  position: fixed;
  inset: 0;
  flex-direction: column;
  align-items: center;
  background: rgba(0, 0, 0, 0.72);
  z-index: 20;
}
.wait-screen p {
  margin: auto;
}
#cancel-btn {
  width: calc(100% - 20px);
  margin-bottom: 24px;
  padding: 10px;
}
  </style>
</head>
<body>
  
  <header class="banner">
  <div class="logo">
    <svg width="40" height="36" viewBox="0 0 64 48" aria-hidden="true">
      <path fill="#ffffff" d="M4 44 V16 L18 28 L28 8 L32 44 Z"/>
      <path fill="#22c55e" d="M32 44 V8 L44 28 L60 16 V44 Z"/>
    </svg>
    <h1>ВИРТ ЛИГА</h1>
  </div>
    <h2>футбольные лиги в телеграмм</h2>
  </header>
  <div class="profile">
    <div class="profile-left">
      <img id="ava" alt="" width="48" height="48">
      <div class="who">
        <span id="nick">Ваня</span>
        <span id="balance">
          <span id="coins"></span>
          <span class="balance-label">Профильный баланс</span>
        </span>
      </div>
    
      
    </div>
    <div class="profile-right">
      Нет активной сессии
    </div>
  </div>
  <div class="center-banner">
    <img id="icon1" alt="" src="icon-find2.png">
    <span id="cbu">Нет активной сессии</span>
    <span id="cbd">Нажмите "найти сессию"<br>чтобы присоединиться к лиге<br>и сыграть с другими игроками.</span>
  </div>
    <button type="button" id="find-btn" class="find-btn">
    
      <span class="loupe"></span>
      <span id="fbtn1">НАЙТИ СЕССИЮ</span>
      <span class="chev">›</span>
    </button>
  <div id="wait" class="wait-screen">
  <p>Ищем сессию</p>
  <p>В очереди: <span id="queue-count">0</span></p>
  <p>Ждёте: <span id="wait-time">0</span> сек</p>
  <button type="button" id="cancel-btn">Отменить</button>
</div>
  <script>
    let timer = null;
    let seconds = 0;
    let clock = null;

    document.getElementById("nick").textContent = "скрипт жив";
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();

  const API = "https://unroll-drivable-majorette.ngrok-free.dev"
  async function sendPass() {
    if (!tg || !tg.initData) return;
    const res = await fetch(API + "/auth", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ initData: tg.initData})
    });

    const data = await res.json();

  if (data.ok) {
    document.getElementById("coins").textContent = data.coins + "⚽"
  }

  }
  

  sendPass();
  }
  
  
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (u) {
  document.getElementById("nick").textContent = u.first_name;

  if (u.photo_url) {
    document.getElementById("ava").src = u.photo_url;
  } else {
    document.getElementById("ava").replaceWith(
      Object.assign(document.createElement("div"), {
        className: "ava-letter",
        textContent: u.first_name.charAt(0)
        })
      );
    }
  }
  const API = "https://unroll-drivable-majorette.ngrok-free.dev"
  document.getElementById("find-btn").onclick = async function () {
const res2 = await fetch(API + "/queue1", {
  method: "POST",
  headers: {"Content-Type": "application/json"},
  body: JSON.stringify({ initData: tg.initData})
})

  const data2 = await res2.json();
  if (data2.ok) {
    document.getElementById("wait").style.display = "flex";
    clearInterval(timer);
    timer = setInterval(async function () {
  const res3 = await fetch(API + "/queue_status", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ initData: tg.initData})

     
  })  
  const data3 = await res3.json();
  if (data3.ok) {
    document.getElementById("queue-count").textContent = data3.count
  }
}, 3000);
  seconds = 0;
  document.getElementById("wait-time").textContent = "0";
  clearInterval(clock);
  clock = setInterval(async function () {
    seconds = seconds + 1;
    document.getElementById("wait-time").textContent = seconds;
  }, 1000);
  }
  
  }
  document.getElementById("cancel-btn").onclick = async function (params) {
    clearInterval(timer);
    clearInterval(clock);
    document.getElementById("wait").style.display = "none";
    await fetch(API + "/queue0", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ initData: tg.initData })
  });
  
};
   
</script>
</body>
</html>
