<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вирт Лига</title>
  <style>
    body {
      margin: 0;
      background: #070b12;
      color: #f3f6fb;
      font-family: Arial, sans-serif;
    }
    .banner-top {
      text-align: right;
    }
    .banner {
      text-align: center;
    }
    .rule {
      border-radius: 12px;
      background: #1a2230;
      color: #9aa4b2;
      padding: 6px 12px;
      margin: 4px 12px;
    }
    .set {
      border-radius: 12px;
      background: #1a2230;
      color: #9aa4b2;
      padding: 6px 12px;
      margin: 4px 12px;
    }
    h1 {
      font-size: 45px;
    }
    h2 {
      font-size: 10px;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="banner-top">
    <button class="rule">
      ?<br>правила
    </button>
    <button class="set">
      ⚙️<br>настройки
    </button>
  </div>
  <header class="banner">
  <div class="logo">
    <svg width="40" height="36" viewBox="0 0 64 48" aria-hidden="true">
    <path fill="#ffffff" d="M4 44 V16 L18 28 L28 8 L32 44 Z"/>
    <path fill="#22c55e" d="M32 44 V8 L44 28 L60 16 V44 Z"/>
  </svg>
    <h1>ВИРТ ЛИГА</h1>
  </div>
    <h2>футбольные лиги в телеграмм</h2>
  </header>
</body>
</html>
