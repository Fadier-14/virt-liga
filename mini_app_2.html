<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вирт Лига</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #070b12;
      color: #f3f6fb;
      font-family: Arial, sans-serif;
    }
    .banner-top {
      text-align: right;
    }
    .rule {
      border: 1px solid #252b33;
      border-radius: 12px;
      background: #070b12;
      color: #9aa4b2;
      padding: 4px 8px;
      margin: 4px 8px;
    }
    .set {
      border: 1px solid #252b33;
      border-radius: 12px;
      background: #070b12;
      color: #9aa4b2;
      padding: 4px 8px;
      margin: 4px 8px;
    }
    h1 {
      font-size: 45px;
    }
    h2 {
      font-size: 10px;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .banner h1 {
      margin: 0px;
      font-family: "Oswald", Arial, sans-serif;
      font-weight: 700;
      letter-spacing: 3px;
    }
    .banner {
      background: #102033;
      background-image: url("stadion_3.jpg");
      background-size: cover;
      background-position: center;
      text-align: center;
      border: 1px solid #252b33;
    }
    .banner {
  background:
    linear-gradient(rgba(7, 11, 18, 0.55), rgba(7, 11, 18, 0.75)),
    url("stadion_3.jpg") center / cover;
  padding: 16px 16px 10px;
}

  </style>
</head>
<body>
  <div class="banner-top">
    <button class="rule">
      ?<br>правила
    </button>
    <button class="set">
      ⚙️<br>настройки
    </button>
  </div>
  <header class="banner">
  <div class="logo">
    <svg width="40" height="36" viewBox="0 0 64 48" aria-hidden="true">
    <path fill="#ffffff" d="M4 44 V16 L18 28 L28 8 L32 44 Z"/>
    <path fill="#22c55e" d="M32 44 V8 L44 28 L60 16 V44 Z"/>
  </svg>
    <h1>ВИРТ ЛИГА</h1>
  </div>
    <h2>футбольные лиги в телеграмм</h2>
  </header>
</body>
</html>
